<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2>Восстановление пароля</h2>
        <p>Здравствуйте, {{ username }}!</p>
        <p>Был получен запрос на сброс вашего пароля. Для установки нового пароля перейдите по ссылке:</p>
        <br>
        <a href="{{ token_link }}" class="button" style="color: white;">Сбросить пароль</a>
        <br><br>
        <p>Если ссылка не работает, скопируйте её в браузер:</p>
        <p style="color: #666; font-size: 12px;">{{ token_link }}</p>
    </div>
</body>
</html>
